<svg xmlns="http://www.w3.org/2000/svg" width="570" height="405" viewBox="0 0 380 230" role="img" aria-label="Externalities (slides 15–16): with external costs, the market supply S ignores them; the true supply St (all costs) is higher, so the market overproduces (Qe ><style>svg{font:12px sans-serif;fill:#1d2622;background:#fff}.ax{stroke:#5c6a63;stroke-width:1.5;fill:none}.gd{stroke:#5c6a63;stroke-width:1;stroke-dasharray:3 3}.l1{stroke:#1f7a5c;stroke-width:2.5;fill:none}.l2{stroke:#c4862a;stroke-width:2.5;fill:none}.l3{stroke:#a63d3d;stroke-width:2;fill:none}.l4{stroke:#2f5c9a;stroke-width:2.5;fill:none}.pt{fill:#a63d3d}.t1{fill:#1f7a5c;font-weight:700}.t2{fill:#8a5512;font-weight:700}.t3{fill:#a63d3d;font-weight:700}.t4{fill:#2f5c9a;font-weight:700}.fl{fill:#1f7a5c;fill-opacity:.15;stroke:none}.fl2{fill:#c4862a;fill-opacity:.2;stroke:none}.fl3{fill:#a63d3d;fill-opacity:.15;stroke:none}.bx{fill:#e7f2ec;stroke:#1f7a5c;stroke-width:1.5}.bx2{fill:#fbf1e1;stroke:#c4862a;stroke-width:1.5}.tk{font-size:10.5px;fill:#5c6a63}.sm{font-size:10.5px}</style> Qo). With external benefits, demand D ignores them; the true demand Dt is higher, so the market underproduces (Qe < Qo)."><text x="110" y="16" text-anchor="middle" font-weight="700">Negative externality</text><line class="ax" x1="42" y1="182" x2="184" y2="182"/><line class="ax" x1="42" y1="182" x2="42" y2="28"/><text x="110" y="220" text-anchor="middle" class="sm">Q</text><text x="10" y="108" transform="rotate(-90 10 108)" text-anchor="middle" class="sm">P</text><line class="l4" x1="55.6" y1="48.8" x2="164.4" y2="167.2"/><text x="166.4" y="165.7" class="t4" text-anchor="start">D</text><line class="l2" x1="55.6" y1="167.2" x2="164.4" y2="48.8"/><text x="166.4" y="47.3" class="t2" text-anchor="start">S</text><line class="l3" x1="44.7" y1="149.4" x2="137.2" y2="48.8"/><text x="139.2" y="47.3" class="t3" text-anchor="start">St</text><circle class="pt" cx="110" cy="108" r="4.5"/><circle class="pt" cx="96.4" cy="93.2" r="4.5"/><text x="110" y="198" text-anchor="middle" class="tk">Qe</text><text x="96.4" y="198" text-anchor="middle" class="tk">Qo</text><line class="gd" x1="110" y1="108" x2="110" y2="182"/><line class="gd" x1="96.4" y1="93.2" x2="96.4" y2="182"/><text x="44.7" y="173.1" class="t3" text-anchor="start">Qe > Qo: overproduction</text><text x="300" y="16" text-anchor="middle" font-weight="700">Positive externality</text><line class="ax" x1="232" y1="182" x2="374" y2="182"/><line class="ax" x1="232" y1="182" x2="232" y2="28"/><text x="300" y="220" text-anchor="middle" class="sm">Q</text><text x="200" y="108" transform="rotate(-90 200 108)" text-anchor="middle" class="sm">P</text><line class="l4" x1="245.6" y1="48.8" x2="354.4" y2="167.2"/><text x="356.4" y="165.7" class="t4" text-anchor="start">D</text><line class="l1" x1="272.8" y1="48.8" x2="359.8" y2="143.5"/><text x="361.9" y="142" class="t1" text-anchor="start">Dt</text><line class="l2" x1="245.6" y1="167.2" x2="354.4" y2="48.8"/><text x="356.4" y="47.3" class="t2" text-anchor="start">S</text><circle class="pt" cx="300" cy="108" r="4.5"/><circle class="pt" cx="313.6" cy="93.2" r="4.5"/><text x="300" y="198" text-anchor="middle" class="tk">Qe</text><text x="313.6" y="198" text-anchor="middle" class="tk">Qo</text><line class="gd" x1="300" y1="108" x2="300" y2="182"/><line class="gd" x1="313.6" y1="93.2" x2="313.6" y2="182"/><text x="234.7" y="173.1" class="t1" text-anchor="start">Qe < Qo: underproduction</text></svg>