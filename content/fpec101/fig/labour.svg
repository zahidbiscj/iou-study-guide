<svg xmlns="http://www.w3.org/2000/svg" width="570" height="405" viewBox="0 0 380 230" role="img" aria-label="Purely competitive labour market (slides 18–19): market demand (MRP) and supply set the wage Wc. Each firm takes Wc as given (MRC = Wc, a horizontal line) and hires up to MRP = MRC; the shaded area is its total wage cost."><style>svg{font:12px sans-serif;fill:#1d2622;background:#fff}.ax{stroke:#5c6a63;stroke-width:1.5;fill:none}.gd{stroke:#5c6a63;stroke-width:1;stroke-dasharray:3 3}.l1{stroke:#1f7a5c;stroke-width:2.5;fill:none}.l2{stroke:#c4862a;stroke-width:2.5;fill:none}.l3{stroke:#a63d3d;stroke-width:2;fill:none}.l4{stroke:#2f5c9a;stroke-width:2.5;fill:none}.pt{fill:#a63d3d}.t1{fill:#1f7a5c;font-weight:700}.t2{fill:#8a5512;font-weight:700}.t3{fill:#a63d3d;font-weight:700}.t4{fill:#2f5c9a;font-weight:700}.fl{fill:#1f7a5c;fill-opacity:.15;stroke:none}.fl2{fill:#c4862a;fill-opacity:.2;stroke:none}.fl3{fill:#a63d3d;fill-opacity:.15;stroke:none}.bx{fill:#e7f2ec;stroke:#1f7a5c;stroke-width:1.5}.bx2{fill:#fbf1e1;stroke:#c4862a;stroke-width:1.5}.tk{font-size:10.5px;fill:#5c6a63}.sm{font-size:10.5px}</style><text x="110" y="16" text-anchor="middle" font-weight="700">Market</text><line class="ax" x1="42" y1="182" x2="184" y2="182"/><line class="ax" x1="42" y1="182" x2="42" y2="28"/><text x="110" y="220" text-anchor="middle" class="sm">Quantity of labour</text><text x="10" y="108" transform="rotate(-90 10 108)" text-anchor="middle" class="sm">Wage</text><line class="l4" x1="55.6" y1="48.8" x2="164.4" y2="167.2"/><text x="166.4" y="165.7" class="t4" text-anchor="start">D = MRP</text><line class="l2" x1="55.6" y1="167.2" x2="164.4" y2="48.8"/><text x="166.4" y="47.3" class="t2" text-anchor="start">S</text><circle class="pt" cx="110" cy="108" r="4.5"/><line class="gd" x1="110" y1="108" x2="110" y2="182"/><line class="gd" x1="110" y1="108" x2="42" y2="108"/><text x="37" y="112" text-anchor="end" class="tk">Wc</text><text x="110" y="198" text-anchor="middle" class="tk">Qc</text><text x="300" y="16" text-anchor="middle" font-weight="700">Firm (wage taker)</text><line class="ax" x1="232" y1="182" x2="374" y2="182"/><line class="ax" x1="232" y1="182" x2="232" y2="28"/><text x="300" y="220" text-anchor="middle" class="sm">Quantity of labour</text><text x="200" y="108" transform="rotate(-90 200 108)" text-anchor="middle" class="sm">Wage</text><line class="l2" x1="232" y1="108" x2="359.8" y2="108"/><text x="294.6" y="102.1" class="t2" text-anchor="start">S = MRC = Wc</text><line class="l4" x1="237.4" y1="45.8" x2="340.8" y2="167.2"/><text x="321.8" y="155.4" class="t4" text-anchor="start">d = MRP</text><circle class="pt" cx="289.8" cy="108" r="4.5"/><line class="gd" x1="289.8" y1="108" x2="289.8" y2="182"/><text x="289.8" y="198" text-anchor="middle" class="tk">qc</text><polygon class="fl" points="232,182 232,108 289.8,108 289.8,182"/></svg>