<svg xmlns="http://www.w3.org/2000/svg" width="570" height="405" viewBox="0 0 380 270" role="img" aria-label="Slides 19–23: at each price the firm produces where P = MC. So the part of the MC curve ABOVE minimum AVC is the firm's short-run supply curve; below P2 it shuts down."><style>svg{font:12px sans-serif;fill:#1d2622;background:#fff}.ax{stroke:#5c6a63;stroke-width:1.5;fill:none}.gd{stroke:#5c6a63;stroke-width:1;stroke-dasharray:3 3}.l1{stroke:#1f7a5c;stroke-width:2.5;fill:none}.l2{stroke:#c4862a;stroke-width:2.5;fill:none}.l3{stroke:#a63d3d;stroke-width:2;fill:none}.l4{stroke:#2f5c9a;stroke-width:2.5;fill:none}.pt{fill:#a63d3d}.t1{fill:#1f7a5c;font-weight:700}.t2{fill:#8a5512;font-weight:700}.t3{fill:#a63d3d;font-weight:700}.t4{fill:#2f5c9a;font-weight:700}.fl{fill:#1f7a5c;fill-opacity:.15;stroke:none}.fl2{fill:#c4862a;fill-opacity:.2;stroke:none}.fl3{fill:#a63d3d;fill-opacity:.15;stroke:none}.bx{fill:#e7f2ec;stroke:#1f7a5c;stroke-width:1.5}.bx2{fill:#fbf1e1;stroke:#c4862a;stroke-width:1.5}.tk{font-size:10.5px;fill:#5c6a63}.sm{font-size:10.5px}</style><line class="ax" x1="55" y1="222" x2="358" y2="222"/><line class="ax" x1="55" y1="222" x2="55" y2="14"/><text x="202" y="258" text-anchor="middle">Output</text><text x="16" y="122" transform="rotate(-90 16 122)" text-anchor="middle">Costs and revenues ($)</text><path class="l1" d="M84.5 30 C94.3 41.3 126.3 83.7 143.5 98 C160.7 112.3 173 112 187.8 116 C202.5 120 217.2 123 232 122 C246.8 121 260.5 116.7 276.2 110 C292 103.3 318 86.7 326.4 82"/><path class="l2" d="M78.6 94 C89.4 101.3 122.8 128.3 143.5 138 C164.2 147.7 182.8 151.7 202.5 152 C222.2 152.3 240.8 149 261.5 140 C282.1 131 315.6 105 326.4 98"/><path class="l3" d="M84.5 118 C91.9 124 116 146.7 128.8 154 C141.5 161.3 148.9 162.3 161.2 162 C173.5 161.7 190.7 158.7 202.5 152 C214.3 145.3 222.2 133 232 122 C241.8 111 252.7 100 261.5 86 C270.4 72 281.2 46 285.1 38" stroke-dasharray="6 4"/><path class="l3" d="M202.5 152 C207.4 147 222.2 133 232 122 C241.8 111 252.7 100 261.5 86 C270.4 72 281.2 46 285.1 38"/><text x="326.4" y="78" class="t1" text-anchor="start">ATC</text><text x="326.4" y="106" class="t2" text-anchor="start">AVC</text><text x="173" y="30" class="t3" text-anchor="start">MC above AVC = supply</text><line class="gd" x1="55" y1="152" x2="202.5" y2="152"/><circle class="pt" cx="202.5" cy="152" r="4.5"/><text x="50" y="156" text-anchor="end" class="tk">P2</text><text x="202.5" y="238" text-anchor="middle" class="tk">Q2</text><line class="gd" x1="55" y1="122" x2="232" y2="122"/><circle class="pt" cx="232" cy="122" r="4.5"/><text x="50" y="126" text-anchor="end" class="tk">P3</text><text x="232" y="238" text-anchor="middle" class="tk">Q3</text><line class="gd" x1="55" y1="98" x2="251.2" y2="98"/><circle class="pt" cx="251.2" cy="98" r="4.5"/><text x="50" y="102" text-anchor="end" class="tk">P4</text><text x="251.2" y="238" text-anchor="middle" class="tk">Q4</text><line class="gd" x1="55" y1="62" x2="273.3" y2="62"/><circle class="pt" cx="273.3" cy="62" r="4.5"/><text x="50" y="66" text-anchor="end" class="tk">P5</text><text x="273.3" y="238" text-anchor="middle" class="tk">Q5</text><text x="66.8" y="170" class="t3" text-anchor="start">below P2 (min AVC): produce nothing</text></svg>