<svg xmlns="http://www.w3.org/2000/svg" width="570" height="405" viewBox="0 0 380 270" role="img" aria-label="A minimum wage above the equilibrium wage is a price floor in the labour market: firms hire fewer workers (Qd) while more people want jobs (Qs). Whether jobs are really lost depends on labour demand and supply conditions (slide 25)."><style>svg{font:12px sans-serif;fill:#1d2622;background:#fff}.ax{stroke:#5c6a63;stroke-width:1.5;fill:none}.gd{stroke:#5c6a63;stroke-width:1;stroke-dasharray:3 3}.l1{stroke:#1f7a5c;stroke-width:2.5;fill:none}.l2{stroke:#c4862a;stroke-width:2.5;fill:none}.l3{stroke:#a63d3d;stroke-width:2;fill:none}.l4{stroke:#2f5c9a;stroke-width:2.5;fill:none}.pt{fill:#a63d3d}.t1{fill:#1f7a5c;font-weight:700}.t2{fill:#8a5512;font-weight:700}.t3{fill:#a63d3d;font-weight:700}.t4{fill:#2f5c9a;font-weight:700}.fl{fill:#1f7a5c;fill-opacity:.15;stroke:none}.fl2{fill:#c4862a;fill-opacity:.2;stroke:none}.fl3{fill:#a63d3d;fill-opacity:.15;stroke:none}.bx{fill:#e7f2ec;stroke:#1f7a5c;stroke-width:1.5}.bx2{fill:#fbf1e1;stroke:#c4862a;stroke-width:1.5}.tk{font-size:10.5px;fill:#5c6a63}.sm{font-size:10.5px}</style><line class="ax" x1="55" y1="222" x2="358" y2="222"/><line class="ax" x1="55" y1="222" x2="55" y2="14"/><text x="202" y="258" text-anchor="middle">Quantity of labour</text><text x="16" y="122" transform="rotate(-90 16 122)" text-anchor="middle">Wage</text><line class="l4" x1="84.5" y1="42" x2="320.5" y2="202"/><text x="324.9" y="200" class="t4" text-anchor="start">D</text><line class="l2" x1="84.5" y1="202" x2="320.5" y2="42"/><text x="324.9" y="40" class="t2" text-anchor="start">S</text><circle class="pt" cx="202.5" cy="122" r="4.5"/><line class="gd" x1="202.5" y1="122" x2="202.5" y2="222"/><line class="gd" x1="202.5" y1="122" x2="55" y2="122"/><line class="l3" x1="55" y1="90" x2="332.3" y2="90"/><text x="60.9" y="84" class="t3" text-anchor="start">minimum wage</text><line class="gd" x1="155.3" y1="90" x2="155.3" y2="222"/><line class="gd" x1="249.7