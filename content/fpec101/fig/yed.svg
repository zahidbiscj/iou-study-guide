<svg xmlns="http://www.w3.org/2000/svg" width="570" height="405" viewBox="0 0 380 200" role="img" aria-label="Income elasticity (slide 25): for a normal good, quantity demanded rises with income; for an inferior good it falls as income rises. (The slide puts income on the vertical axis; the direction of the relationship is what matters.)"><style>svg{font:12px sans-serif;fill:#1d2622;background:#fff}.ax{stroke:#5c6a63;stroke-width:1.5;fill:none}.gd{stroke:#5c6a63;stroke-width:1;stroke-dasharray:3 3}.l1{stroke:#1f7a5c;stroke-width:2.5;fill:none}.l2{stroke:#c4862a;stroke-width:2.5;fill:none}.l3{stroke:#a63d3d;stroke-width:2;fill:none}.l4{stroke:#2f5c9a;stroke-width:2.5;fill:none}.pt{fill:#a63d3d}.t1{fill:#1f7a5c;font-weight:700}.t2{fill:#8a5512;font-weight:700}.t3{fill:#a63d3d;font-weight:700}.t4{fill:#2f5c9a;font-weight:700}.fl{fill:#1f7a5c;fill-opacity:.15;stroke:none}.fl2{fill:#c4862a;fill-opacity:.2;stroke:none}.fl3{fill:#a63d3d;fill-opacity:.15;stroke:none}.bx{fill:#e7f2ec;stroke:#1f7a5c;stroke-width:1.5}.bx2{fill:#fbf1e1;stroke:#c4862a;stroke-width:1.5}.tk{font-size:10.5px;fill:#5c6a63}.sm{font-size:10.5px}</style><g transform="translate(0 0)"><line class="ax" x1="30" y1="170" x2="170" y2="170"/><line class="ax" x1="30" y1="170" x2="30" y2="30"/><text x="100" y="22" text-anchor="middle" font-weight="700">Normal good (YED +)</text><line class="l1" x1="40" y1="160" x2="160" y2="50"/><text x="100" y="190" text-anchor="middle" class="sm">Quantity demanded</text><text x="12" y="100" transform="rotate(-90 12 100)" text-anchor="middle" class="sm">Income</text></g><g transform="translate(190 0)"><line class="ax" x1="30" y1="170" x2="170" y2="170"/><line class="ax" x1="30" y1="170" x2="30" y2="30"/><text x="100" y="22" text-anchor="middle" font-weight="700">Inferior good (YED −)</text><line class="l3" x1="40" y1="50" x2="160" y2="160"/><text x="100" y="190" text-anchor="middle" class="sm">Quantity demanded</text><text x="12" y="100" transform="rotate(-90 12 100)" text-anchor="middle" class="sm">Income</text></g></svg>