<svg xmlns="http://www.w3.org/2000/svg" width="570" height="405" viewBox="0 0 380 270" role="img" aria-label="Lorenz curve (slides 6–9): bottom 20% of households get 3.4% of income, bottom 40% get 12.1%, and so on. The further the curve sags below the diagonal, the more unequal the income. Gini = A ÷ (A + B): 0 = complete equality, 1 = complete inequality."><style>svg{font:12px sans-serif;fill:#1d2622;background:#fff}.ax{stroke:#5c6a63;stroke-width:1.5;fill:none}.gd{stroke:#5c6a63;stroke-width:1;stroke-dasharray:3 3}.l1{stroke:#1f7a5c;stroke-width:2.5;fill:none}.l2{stroke:#c4862a;stroke-width:2.5;fill:none}.l3{stroke:#a63d3d;stroke-width:2;fill:none}.l4{stroke:#2f5c9a;stroke-width:2.5;fill:none}.pt{fill:#a63d3d}.t1{fill:#1f7a5c;font-weight:700}.t2{fill:#8a5512;font-weight:700}.t3{fill:#a63d3d;font-weight:700}.t4{fill:#2f5c9a;font-weight:700}.fl{fill:#1f7a5c;fill-opacity:.15;stroke:none}.fl2{fill:#c4862a;fill-opacity:.2;stroke:none}.fl3{fill:#a63d3d;fill-opacity:.15;stroke:none}.bx{fill:#e7f2ec;stroke:#1f7a5c;stroke-width:1.5}.bx2{fill:#fbf1e1;stroke:#c4862a;stroke-width:1.5}.tk{font-size:10.5px;fill:#5c6a63}.sm{font-size:10.5px}</style><line class="ax" x1="55" y1="222" x2="358" y2="222"/><line class="ax" x1="55" y1="222" x2="55" y2="14"/><text x="202" y="258" text-anchor="middle">Cumulative % of households</text><text x="16" y="122" transform="rotate(-90 16 122)" text-anchor="middle">Cumulative % of income</text><polygon class="fl3" points="55,222 114,215.2 173,197.8 232,169.2 291,123.4 338.2,30"/><line class="l1" x1="55" y1="222" x2="338.2" y2="30"/><text x="208.4" y="98" class="t1" text-anchor="start">line of perfect equality</text><path class="l4" d="M55 222 C64.8 220.9 94.3 219.2 114 215.2 C133.7 211.2 153.3 205.5 173 197.8 C192.7 190.1 212.3 181.6 232 169.2 C251.7 156.8 273.3 146.6 291 123.4 C308.7 100.2 330.3 45.6 338.2 30"/><text x="249.7" y="170" class="t4" text-anchor="start">Lorenz curve</text><circle class="pt" cx="114" cy="215.2" r="4.5"/><circle class="pt" cx="173" cy="197.8" r="4.5"/><text x="173" y="130" class="t3" text-anchor="start">A</text><text x="279.2" y="194" class="t4" text-anchor="start">B</text><text x="114" y="238" text-anchor="middle" class="tk">20</text><text x="173" y="238" text-anchor="middle" class="tk">40</text><text x="232" y="238" text-anchor="middle" class="tk">60</text><text x="291" y="238" text-anchor="middle" class="tk">80</text></svg>