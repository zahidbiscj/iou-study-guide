<svg xmlns="http://www.w3.org/2000/svg" width="570" height="405" viewBox="0 0 380 270" role="img" aria-label="Price ceiling (maximum price) set BELOW equilibrium: buyers want Qd but sellers offer only Qs → a persistent shortage, queues, rationing, black markets."><style>svg{font:12px sans-serif;fill:#1d2622;background:#fff}.ax{stroke:#5c6a63;stroke-width:1.5;fill:none}.gd{stroke:#5c6a63;stroke-width:1;stroke-dasharray:3 3}.l1{stroke:#1f7a5c;stroke-width:2.5;fill:none}.l2{stroke:#c4862a;stroke-width:2.5;fill:none}.l3{stroke:#a63d3d;stroke-width:2;fill:none}.l4{stroke:#2f5c9a;stroke-width:2.5;fill:none}.pt{fill:#a63d3d}.t1{fill:#1f7a5c;font-weight:700}.t2{fill:#8a5512;font-weight:700}.t3{fill:#a63d3d;font-weight:700}.t4{fill:#2f5c9a;font-weight:700}.fl{fill:#1f7a5c;fill-opacity:.15;stroke:none}.fl2{fill:#c4862a;fill-opacity:.2;stroke:none}.fl3{fill:#a63d3d;fill-opacity:.15;stroke:none}.bx{fill:#e7f2ec;stroke:#1f7a5c;stroke-width:1.5}.bx2{fill:#fbf1e1;stroke:#c4862a;stroke-width:1.5}.tk{font-size:10.5px;fill:#5c6a63}.sm{font-size:10.5px}</style><line class="ax" x1="55" y1="222" x2="358" y2="222"/><line class="ax" x1="55" y1="222" x2="55" y2="14"/><text x="202" y="258" text-anchor="middle">Quantity of wheat</text><text x="16" y="122" transform="rotate(-90 16 122)" text-anchor="middle">Price of wheat</text><line class="l4" x1="84.5" y1="42" x2="320.5" y2="202"/><text x="324.9" y="200" class="t4" text-anchor="start">D</text><line class="l2" x1="84.5" y1="202" x2="320.5" y2="42"/><text x="324.9" y="40" class="t2" text-anchor="start">S</text><circle class="pt" cx="202.5" cy="122" r="4.5"/><line class="gd" x1="202.5" y1="122" x2="202.5" y2="222"/><line class="gd" x1="202.5" y1="122" x2="55" y2="122"/><line class="l3" x1="55" y1="158" x2="338.2" y2="158"/><text x="261.5" y="154" class="t3" text-anchor="start">Price ceiling P1</text><line class="gd" x1="149.4" y1="158" x2="149.4" y2="222"/><line class="gd" x1="255.6" y1="158" x2="255.6" y2="222"/><line class="l1" x1="149.4" y1="168" x2="255.6" y2="168"/><text x="161.2" y="180" class="t1" text-anchor="start">← shortage (excess demand) →</text><text x="50" y="126" text-anchor="end" class="tk">Pe</text><text x="50" y="162" text-anchor="end" class="tk">P1</text><text x="149.4" y="238" text-anchor="middle" class="tk">Qs</text><text x="202.5" y="238" text-anchor="middle" class="tk">Qe</text><text x="255.6" y="238" text-anchor="middle" class="tk">Qd</text></svg>