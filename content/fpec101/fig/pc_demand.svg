="232" y2="28"/><text x="300" y="260" text-anchor="middle" class="sm">Output</text><text x="200" y="128" transform="rotate(-90 200 128)" text-anchor="middle" class="sm">Price, AR, MR</text><line class="l1" x1="232" y1="128" x2="359.8" y2="128"/><text x="272.8" y="116.7" class="t1" text-anchor="start">D = P = AR = MR</text><text x="227" y="132" text-anchor="end" class="tk">P</text></svg>